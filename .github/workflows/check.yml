name: Family OS full-stack quality gates
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install Chromium for browser certification
        run: npx playwright install --with-deps chromium
      - name: Cross-module browser and accessibility certification
        run: npm run test:e2e
      - name: Publish browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-os-phase-8-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: family_admin
          POSTGRES_PASSWORD: ci_admin_ephemeral
          POSTGRES_DB: family_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_admin -d family_os_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://family_admin:ci_admin_ephemeral@127.0.0.1:5432/family_os_ci
      DATABASE_URL: postgresql://family_runtime:ci_runtime_ephemeral@127.0.0.1:5432/family_os_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Strict backend TypeScript
        run: npm run typecheck:api
      - name: Run versioned PostgreSQL migrations and provision restricted role
        run: npm run db:migrate
      - name: Verify idempotent migration and checksum gate
        run: npm run db:migrate
      - name: Real PostgreSQL/OIDC/tenant integration certification
        run: npm run test:api

  staging-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging configuration template
        run: node infra/staging/preflight.mjs infra/staging/.env.example --template
      - name: Validate Docker Compose topology without real credentials
        run: docker compose --env-file infra/staging/.env.example -f infra/staging/compose.yaml config --quiet
      - name: Validate Caddy TLS proxy config
        run: |
          docker run --rm \
            -e ACME_EMAIL=operator@example.invalid \
            -e FAMILY_API_DOMAIN=api.family.example.invalid \
            -e FAMILY_IDENTITY_DOMAIN=identity.family.example.invalid \
            -e FAMILY_ADMIN_ALLOW_CIDR=127.0.0.1/32 \
            -v "$PWD/infra/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate staging scripts before deployment
        run: |
          node --check infra/staging/preflight.mjs
          node --check infra/staging/verify-live.mjs
          node --check infra/staging/certify-users.mjs
          bash -n infra/staging/deploy.sh
      - name: Build isolated production API Docker image
        run: docker build -f infra/staging/api.Dockerfile -t family-os-api:b1-1 .
      - name: Check production image boots Node and includes migration scripts
        run: |
          docker run --rm family-os-api:b1-1 node --version
          docker run --rm family-os-api:b1-1 node -e "const fs=require('fs');if(!fs.existsSync('/app/dist-server/src/index.js')||!fs.existsSync('/app/dist-server/migrations/0002_b1_registry.sql'))process.exit(1);"
