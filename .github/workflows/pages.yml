name: Build and deploy Family OS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - name: Build verified-registry-capable frontend
        env:
          VITE_FAMILY_API_URL: ${{ vars.VITE_FAMILY_API_URL }}
          VITE_FAMILY_OIDC_AUTHORITY: ${{ vars.VITE_FAMILY_OIDC_AUTHORITY }}
          VITE_FAMILY_OIDC_CLIENT_ID: ${{ vars.VITE_FAMILY_OIDC_CLIENT_ID }}
          VITE_FAMILY_OIDC_SCOPE: ${{ vars.VITE_FAMILY_OIDC_SCOPE }}
        run: npm run build
      # Pages must be enabled once by the repository owner in Settings.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
